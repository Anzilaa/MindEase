<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - MindEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #bbf7d0 0%, #a7f3d0 100%);
        min-height: 100vh;
        color: #1f2937;
        line-height: 1.6;
        position: relative;
      }

      /* Header Styles - Matching Home Page */
      .header {
        background: rgba(240, 253, 244, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 20px rgba(45, 90, 61, 0.1);
        position: sticky;
        top: 0;
        height: 75px;
        z-index: 100;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        height: 100%;
        padding: 0 24px;
      }

      .logo-section {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo-section span {
        font-weight: bold;
        font-size: 1.8em;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 4px rgba(34, 197, 94, 0.1);
      }

      /* Hamburger Menu Styles */
      .hamburger-container {
        position: relative;
      }

      #dropdown-toggle {
        background: none;
        border: none;
        cursor: pointer;
        outline: none;
        position: relative;
        z-index: 3100;
        padding: 6px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      #dropdown-toggle:hover {
        transform: translateY(-1px);
      }

      #dropdown-toggle svg rect {
        fill: #22c55e;
        transition: all 0.3s ease;
      }

      #dropdown-toggle:hover svg rect {
        fill: #16a34a;
      }

      /* Dropdown Menu */
      #dropdown-menu {
        display: none;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        position: absolute;
        left: 0;
        top: 40px;
        background: rgba(240, 253, 244, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.15);
        border-radius: 12px;
        padding: 8px 0;
        min-width: 160px;
        z-index: 3200;
        border: 1px solid rgba(34, 197, 94, 0.1);
      }

      #dropdown-menu.show {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }

      #dropdown-menu nav {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      #dropdown-menu a {
        padding: 8px 16px;
        color: #16a34a;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        border-radius: 6px;
        margin: 1px 6px;
        font-size: 0.95em;
      }

      #dropdown-menu a:hover {
        background: rgba(34, 197, 94, 0.1);
        color: #15803d;
        transform: translateX(4px);
      }

      /* Right Navigation */
      .nav-links {
        display: flex;
        align-items: center;
      }

      .nav-links a {
        margin-right: 24px;
        color: #16a34a;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
      }

      .nav-links a:last-child {
        margin-right: 0;
      }

      .nav-links a:hover {
        background: rgba(34, 197, 94, 0.1);
        color: #15803d;
        transform: translateY(-1px);
      }

      .nav-links a.active {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      }

      /* Main Content */
      main {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 24px;
      }

      .hero-section {
        text-align: center;
        margin-bottom: 50px;
        padding: 40px 0;
      }

      .hero-section h1 {
        font-size: 3em;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 20px;
        font-weight: 700;
      }

      .hero-section p {
        font-size: 1.2em;
        color: #166534;
        max-width: 600px;
        margin: 0 auto;
        opacity: 0.9;
      }

      /* Form Styles */
      .form-container {
        background: rgba(240, 253, 244, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.1);
        margin-bottom: 40px;
      }

      .form-group {
        margin-bottom: 24px;
      }

      label {
        display: block;
        font-weight: 600;
        color: #16a34a;
        margin-bottom: 8px;
        font-size: 1.1em;
      }

      input, textarea, select {
        width: 100%;
        padding: 16px;
        border: 2px solid #d1fae5;
        border-radius: 12px;
        font-size: 16px;
        font-family: inherit;
        background: rgba(255, 255, 255, 0.8);
        transition: all 0.3s ease;
        color: #1f2937;
      }

      select {
        padding-right: 40px;
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2316a34a' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 12px center;
        background-repeat: no-repeat;
        background-size: 16px;
      }

      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        background: rgba(240, 253, 244, 1);
        transform: translateY(-1px);
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      .submit-btn {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        border: none;
        padding: 16px 32px;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        width: 100%;
        margin-top: 10px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        background: linear-gradient(135deg, #16a34a, #15803d);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      /* Contact List Styles */
      .contacts-section {
        background: rgba(240, 253, 244, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.1);
      }

      .contacts-section h3 {
        color: #16a34a;
        margin-bottom: 20px;
        font-size: 1.5em;
        text-align: center;
      }

      .contact-item {
        background: rgba(34, 197, 94, 0.05);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
        border-left: 4px solid #22c55e;
        transition: all 0.3s ease;
      }

      .contact-item:hover {
        transform: translateX(4px);
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
      }

      .contact-name {
        font-weight: 600;
        color: #16a34a;
        font-size: 1.1em;
        margin-bottom: 4px;
      }

      .contact-subject {
        color: #22c55e;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .contact-message {
        color: #4ade80;
        line-height: 1.5;
      }

      .empty-state {
        text-align: center;
        color: #86efac;
        font-style: italic;
        padding: 40px;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .navbar {
          padding: 0 16px;
        }

        .nav-links {
          display: none;
        }

        .logo-section span {
          font-size: 1.5em;
        }

        .hero-section h1 {
          font-size: 2.2em;
        }

        .hero-section p {
          font-size: 1.1em;
        }

        .form-container, .contacts-section {
          padding: 24px;
          margin: 0 16px;
        }

        main {
          padding: 0 16px;
          margin: 20px auto;
        }
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-container, .contacts-section {
        animation: fadeInUp 0.6s ease;
      }

      .hero-section {
        animation: fadeInUp 0.8s ease;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="navbar">
        <!-- Left side: Hamburger + Logo -->
        <div class="logo-section">
          <!-- Hamburger to the left of logo -->
          <div class="hamburger-container">
            <button id="dropdown-toggle">
              <svg width="28" height="28" viewBox="0 0 32 32">
                <rect y="8" width="28" height="2.5" rx="1.25" />
                <rect y="14.75" width="28" height="2.5" rx="1.25" />
                <rect y="21.5" width="28" height="2.5" rx="1.25" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div id="dropdown-menu">
              <nav>
                <a href="main.html">Home</a>
                <a href="profile.html">Profile</a>
                <a href="emergency.html">Emergency</a>
                <a href="#resources">Resources</a>
                <a href="focus.html">Focus</a>
              </nav>
            </div>
          </div>
          
          <img src="logo.png" alt="MindEase" style="height: 50px;">
        </div>

        <!-- Right side: Main navigation -->
        <div class="nav-links">
          <a href="main.html">Home</a>
          <a href="../root/about.html">About Us</a>
          <a href="contact.html" class="active">Contact</a>
          <a href="feedback.html">Feedback</a>
        </div>
      </div>
    </header>

    <main>
      <section class="hero-section">
        <h1>Get in Touch</h1>
        <p>
          We're here to support your mental wellness journey. Share your thoughts, questions, 
          or ideas with us - every message matters.
        </p>
      </section>

      <div class="form-container">
        <form id="contactForm">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required />
          </div>

          <div class="form-group">
            <label for="subject">What can we help you with?</label>
            <select id="subject" name="subject" required>
              <option value="">Select a topic</option>
              <option value="General Inquiry">General Inquiry</option>
              <option value="Technical Support">Technical Support</option>
              <option value="Feature Request">Feature Request</option>
              <option value="Bug Report">Bug Report</option>
              <option value="Partnership">Partnership</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" placeholder="Share your thoughts, questions, or feedback with us..." required></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>

      <section class="contacts-section">
        <h3>Recent Conversations</h3>
        <div id="contactList">
          <div class="empty-state">
            No messages yet. Be the first to reach out!
          </div>
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("dropdown-toggle");
        const dropdownMenu = document.getElementById("dropdown-menu");

        toggleBtn.addEventListener("click", function () {
          dropdownMenu.classList.toggle("show");
        });

        // Close if clicking outside
        document.addEventListener("click", function (e) {
          if (
            !toggleBtn.contains(e.target) &&
            !dropdownMenu.contains(e.target)
          ) {
            dropdownMenu.classList.remove("show");
          }
        });
      });

      document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        
        if (name && subject && message) {
          addContactToList(name, subject, message);
          this.reset();
          
          // Success feedback
          const btn = document.querySelector('.submit-btn');
          const originalText = btn.textContent;
          btn.textContent = 'Message Sent! ✓';
          btn.style.background = 'linear-gradient(135deg, #16a34a, #15803d)';
          
          setTimeout(() => {
            btn.textContent = originalText;
            btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
          }, 2000);
        }
      });

      function addContactToList(name, subject, message) {
        const contactList = document.getElementById('contactList');
        
        // Remove empty state if it exists
        const emptyState = contactList.querySelector('.empty-state');
        if (emptyState) {
          emptyState.remove();
        }
        
        const contactItem = document.createElement('div');
        contactItem.className = 'contact-item';
        contactItem.innerHTML = `
          <div class="contact-name">${name}</div>
          <div class="contact-subject">${subject}</div>
          <div class="contact-message">${message}</div>
        `;
        
        contactList.insertBefore(contactItem, contactList.firstChild);
        
        // Add fade-in animation
        contactItem.style.opacity = '0';
        contactItem.style.transform = 'translateY(20px)';
        
        setTimeout(() => {
          contactItem.style.transition = 'all 0.5s ease';
          contactItem.style.opacity = '1';
          contactItem.style.transform = 'translateY(0)';
        }, 100);
      }
    </script>
  </body>
</html>
