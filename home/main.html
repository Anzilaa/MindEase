<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #bbf7d0 0%, #a7f3d0 100%);
        min-height: 100vh;
        color: #1f2937;
        line-height: 1.6;
        position: relative;
      }

      /* Header Styles */
      .header {
        background: rgba(240, 253, 244, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 20px rgba(45, 90, 61, 0.1);
        position: sticky;
        top: 0;
        height: 75px;
        z-index: 100;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        height: 100%;
        padding: 0 24px;
      }

      .logo-section {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo-section span {
        font-weight: bold;
        font-size: 1.8em;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 4px rgba(34, 197, 94, 0.1);
      }

      /* Hamburger Menu Styles */
      .hamburger-container {
        position: relative;
      }

      #dropdown-toggle {
        background: none;
        border: none;
        cursor: pointer;
        outline: none;
        position: relative;
        z-index: 3100;
        padding: 6px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      #dropdown-toggle:hover {
        transform: translateY(-1px);
      }

      #dropdown-toggle svg rect {
        fill: #22c55e;
        transition: all 0.3s ease;
      }

      #dropdown-toggle:hover svg rect {
        fill: #16a34a;
      }

      /* Dropdown Menu */
      #dropdown-menu {
        display: none;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        position: absolute;
        left: 0;
        top: 40px;
        background: rgba(240, 253, 244, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.15);
        border-radius: 12px;
        padding: 8px 0;
        min-width: 160px;
        z-index: 3200;
        border: 1px solid rgba(34, 197, 94, 0.1);
      }

      #dropdown-menu.show {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }

      #dropdown-menu nav {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      #dropdown-menu a {
        padding: 8px 16px;
        color: #16a34a;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        border-radius: 6px;
        margin: 1px 6px;
        font-size: 0.95em;
      }

      #dropdown-menu a:hover {
        background: rgba(34, 197, 94, 0.1);
        color: #15803d;
        transform: translateX(4px);
      }

      /* Right Navigation */
      .nav-links {
        display: flex;
        align-items: center;
      }

      .nav-links a {
        margin-right: 24px;
        color: #16a34a;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
      }

      .nav-links a:last-child {
        margin-right: 0;
      }

      .nav-links a:hover {
        background: rgba(34, 197, 94, 0.1);
        color: #15803d;
        transform: translateY(-1px);
      }

      .nav-links a.active {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      }

      /* Main Content */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      /* Affirmation Quote */
      .affirmation-section {
        text-align: center;
        margin-bottom: 40px;
        padding: 30px;
      }

      #affirmation-quote {
        font-size: 2.4em;
        color: #16a34a;
        font-weight: 1000;
        line-height: 1.6;
        font-style: italic;
      }

      /* Quick Actions */
      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 24px;
        margin: 40px 0;
      }

      .action-card {
        background: rgba(240, 253, 244, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        text-decoration: none;
        color: #16a34a;
        font-weight: 600;
        font-size: 1.1em;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.1);
        min-width: 180px;
      }

      .action-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.2);
        background: rgba(34, 197, 94, 0.05);
      }

      .journal-link {
        background: radial-gradient(circle, #22c55e 0%, #16a34a 70%);
        color: white !important;
      }

      .journal-link:hover {
        background: radial-gradient(circle, #16a34a 0%, #15803d 70%);
        color: white !important;
      }

      .mood-link {
        background: radial-gradient(circle, #4ade80 0%, #22c55e 70%);
        color: white !important;
      }

      .mood-link:hover {
        background: radial-gradient(circle, #22c55e 0%, #16a34a 70%);
        color: white !important;
      }

      /* Mood Charts Section */
      .charts-section {
        background: rgba(209, 250, 229, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 25px 50px rgba(34, 197, 94, 0.2);
        border: 1px solid rgba(34, 197, 94, 0.2);
        margin: 40px 0;
      }

      .charts-section h2 {
        text-align: center;
        color: #15803d;
        font-size: 2em;
        margin-bottom: 30px;
        font-weight: 800;
      }

      .charts-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
      }

      .chart-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 16px rgba(34, 197, 94, 0.1);
      }

      .chart-title {
        color: #16a34a;
        font-weight: 600;
        margin-bottom: 10px;
        font-size: 1.1em;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .navbar {
          padding: 0 16px;
        }

        .nav-links {
          display: none;
        }

        .logo-section span {
          font-size: 1.5em;
        }

        main {
          padding: 20px 16px;
        }

        .charts-section {
          padding: 24px;
        }

        .charts-container {
          gap: 20px;
        }

        .quick-actions {
          flex-direction: column;
          align-items: center;
        }

        .action-card {
          width: 100%;
          max-width: 300px;
        }

        #affirmation-quote {
          font-size: 1.2em;
        }
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .affirmation-section,
      .charts-section {
        animation: fadeInUp 0.6s ease;
      }

      .action-card {
        animation: fadeInUp 0.8s ease;
      }

      .action-card:nth-child(2) {
        animation-delay: 0.1s;
      }

      /* Loading state for charts */
      .chart-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 220px;
        height: 220px;
        color: #16a34a;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="navbar">
        <!-- Left side: Hamburger + Logo -->
        <div class="logo-section">
          <!-- Hamburger to the left of logo -->
          <div class="hamburger-container">
            <button id="dropdown-toggle">
              <svg width="28" height="28" viewBox="0 0 32 32">
                <rect y="8" width="28" height="2.5" rx="1.25" />
                <rect y="14.75" width="28" height="2.5" rx="1.25" />
                <rect y="21.5" width="28" height="2.5" rx="1.25" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div id="dropdown-menu">
              <nav>
                <a href="main.html">Home</a>
                <a href="profile.html">Profile</a>
                <a href="emergency.html">Emergency</a>
                <a href="#resources">Resources</a>
                <a href="focus.html">Focus</a>
              </nav>
            </div>
          </div>
          
          <img src="logo.png" alt="MindEase" style="height: 50px;">
        </div>

        <!-- Right side: Main navigation -->
        <div class="nav-links">
          <a href="main.html" class="active">Home</a>
          <a href="../root/about.html">About Us</a>
          <a href="contact.html">Contact</a>
          <a href="feedback.html">Feedback</a>
        </div>
      </div>
    </header>

    <main>
      <!-- Affirmation Quote -->
      <div class="affirmation-section">
        <div id="affirmation-quote">Loading your daily inspiration...</div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <a href="journal.html" class="action-card journal-link">
          Go to Journal
        </a>
        <a href="../components/mood.html" class="action-card mood-link">
          Daily Mood Form
        </a>
      </div>

      <!-- Mood Charts Section -->
      <div class="charts-section">
        <h2>Your Mood Insights</h2>
        <div class="charts-container">
          <div class="chart-wrapper">
            <div class="chart-title">Daily Mood</div>
            <canvas id="daily-mood-chart" width="220" height="220"></canvas>
          </div>
          <div class="chart-wrapper">
            <div class="chart-title">Weekly Mood Trends</div>
            <canvas id="weekly-mood-chart" width="220" height="220"></canvas>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("dropdown-toggle");
        const dropdownMenu = document.getElementById("dropdown-menu");

        toggleBtn.addEventListener("click", function () {
          dropdownMenu.classList.toggle("show");
        });

        // Close if clicking outside
        document.addEventListener("click", function (e) {
          if (
            !toggleBtn.contains(e.target) &&
            !dropdownMenu.contains(e.target)
          ) {
            dropdownMenu.classList.remove("show");
          }
        });

        // Simple affirmation rotation (since we don't have the external file)
        const affirmations = [
          "You are capable of amazing things.",
          "Today is full of possibilities.",
          "Your mental health matters.",
          "Take it one step at a time.",
          "You are stronger than you think.",
          "This moment is a fresh start.",
          "You deserve peace and happiness."
        ];

        function displayAffirmation() {
          const affirmationElement = document.getElementById('affirmation-quote');
          const randomAffirmation = affirmations[Math.floor(Math.random() * affirmations.length)];
          affirmationElement.textContent = randomAffirmation;
        }

        // Display affirmation immediately
        displayAffirmation();

        // Mock chart data (since we don't have the actual chart library)
        const dailyChart = document.getElementById('daily-mood-chart');
        const weeklyChart = document.getElementById('weekly-mood-chart');
        
        // Add loading text to charts
        if (dailyChart) {
          const ctx = dailyChart.getContext('2d');
          ctx.fillStyle = '#16a34a';
          ctx.font = '16px Montserrat';
          ctx.textAlign = 'center';
          ctx.fillText('Daily Mood Chart', 110, 100);
          ctx.fillText('Loading...', 110, 130);
        }

        if (weeklyChart) {
          const ctx = weeklyChart.getContext('2d');
          ctx.fillStyle = '#16a34a';
          ctx.font = '16px Montserrat';
          ctx.textAlign = 'center';
          ctx.fillText('Weekly Mood Chart', 110, 100);
          ctx.fillText('Loading...', 110, 130);
        }
      });
    </script>
    
    <!-- External scripts (commented out since we don't have access to them) -->
    <!-- <script src="../root/affirmations.js" defer></script> -->
    <!-- <script type="module" src="js/mood-charts.js"></script> -->
  </body>
</html>
