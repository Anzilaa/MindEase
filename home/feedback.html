<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #bbf7d0 0%, #a7f3d0 100%);
        min-height: 100vh;
        color: #1f2937;
        line-height: 1.6;
        position: relative;
      }

      /* Header Styles - Matching home page exactly */
      .header {
        background: rgba(240, 253, 244, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 20px rgba(45, 90, 61, 0.1);
        position: sticky;
        top: 0;
        height: 75px;
        z-index: 100;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        height: 100%;
        padding: 0 24px;
      }

      .logo-section {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo-section span {
        font-weight: bold;
        font-size: 1.8em;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 4px rgba(34, 197, 94, 0.1);
      }

      /* Hamburger Menu Styles */
      .hamburger-container {
        position: relative;
      }

      #dropdown-toggle {
        background: none;
        border: none;
        cursor: pointer;
        outline: none;
        position: relative;
        z-index: 3100;
        padding: 6px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      #dropdown-toggle:hover {
        transform: translateY(-1px);
      }

      #dropdown-toggle svg rect {
        fill: #22c55e;
        transition: all 0.3s ease;
      }

      #dropdown-toggle:hover svg rect {
        fill: #16a34a;
      }

      /* Dropdown Menu */
      #dropdown-menu {
        display: none;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        position: absolute;
        left: 0;
        top: 40px;
        background: rgba(240, 253, 244, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.15);
        border-radius: 12px;
        padding: 8px 0;
        min-width: 160px;
        z-index: 3200;
        border: 1px solid rgba(34, 197, 94, 0.1);
      }

      #dropdown-menu.show {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }

      #dropdown-menu nav {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      #dropdown-menu a {
        padding: 8px 16px;
        color: #16a34a;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        border-radius: 6px;
        margin: 1px 6px;
        font-size: 0.95em;
      }

      #dropdown-menu a:hover {
        background: rgba(34, 197, 94, 0.1);
        color: #15803d;
        transform: translateX(4px);
      }

      /* Right Navigation */
      .nav-links {
        display: flex;
        align-items: center;
      }

      .nav-links a {
        margin-right: 24px;
        color: #16a34a;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
      }

      .nav-links a:last-child {
        margin-right: 0;
      }

      .nav-links a:hover {
        background: rgba(34, 197, 94, 0.1);
        color: #15803d;
        transform: translateY(-1px);
      }

      .nav-links a.active {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      }

      /* Main Content */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      /* Feedback Form Styles */
      .feedback-container {
        background: rgba(240, 253, 244, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 25px 50px rgba(34, 197, 94, 0.2);
        border: 1px solid rgba(34, 197, 94, 0.2);
        max-width: 600px;
        margin: 0 auto;
      }

      .feedback-container h2 {
        text-align: center;
        color: #15803d;
        font-size: 2em;
        margin-bottom: 30px;
        font-weight: 700;
      }

      #feedbackForm {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      #feedbackForm input,
      #feedbackForm textarea {
        padding: 16px;
        border: 2px solid rgba(34, 197, 94, 0.2);
        border-radius: 12px;
        font-family: 'Montserrat', sans-serif;
        font-size: 1em;
        background: rgba(255, 255, 255, 0.8);
        color: #1f2937;
        transition: all 0.3s ease;
      }

      #feedbackForm input:focus,
      #feedbackForm textarea:focus {
        outline: none;
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        transform: translateY(-2px);
      }

      #feedbackForm textarea {
        min-height: 120px;
        resize: vertical;
      }

      #feedbackForm button {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        border: none;
        padding: 16px 32px;
        border-radius: 12px;
        font-family: 'Montserrat', sans-serif;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      }

      #feedbackForm button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        background: linear-gradient(135deg, #16a34a, #15803d);
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .navbar {
          padding: 0 16px;
        }

        .nav-links {
          display: none;
        }

        .logo-section span {
          font-size: 1.5em;
        }

        main {
          padding: 20px 16px;
        }

        .feedback-container {
          padding: 24px;
        }

        .feedback-header {
          padding: 0 16px;
        }

        .feedback-header h1 {
          font-size: 2em;
        }

        .feedback-header p {
          font-size: 1.1em;
        }
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInFromLeft {
        from {
          opacity: 0;
          transform: translateX(-50px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInFromRight {
        from {
          opacity: 0;
          transform: translateX(50px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .feedback-header {
        animation: slideInFromLeft 0.8s ease;
      }

      .feedback-container {
        animation: fadeInUp 0.6s ease;
        animation-delay: 0.3s;
        opacity: 0;
        animation-fill-mode: forwards;
      }

      /* Feedback Header Styles */
      .feedback-header {
        text-align: center;
        margin-bottom: 40px;
        padding: 0 24px;
      }

      .feedback-header h1 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 2.5em;
        color: #15803d;
        margin-bottom: 16px;
        text-shadow: 0 2px 4px rgba(21, 128, 61, 0.1);
      }

      .feedback-header p {
        font-family: 'Montserrat', sans-serif;
        font-weight: 300;
        font-size: 1.2em;
        color: #16a34a;
        line-height: 1.6;
        max-width: 600px;
        margin: 0 auto;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <!-- Exact same header as home page -->
    <header class="header">
      <div class="navbar">
        <!-- Left side: Hamburger + Logo -->
        <div class="logo-section">
          <!-- Hamburger to the left of logo -->
          <div class="hamburger-container">
            <button id="dropdown-toggle">
              <svg width="28" height="28" viewBox="0 0 32 32">
                <rect y="8" width="28" height="2.5" rx="1.25" />
                <rect y="14.75" width="28" height="2.5" rx="1.25" />
                <rect y="21.5" width="28" height="2.5" rx="1.25" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div id="dropdown-menu">
              <nav>
                <a href="main.html">Home</a>
                <a href="profile.html">Profile</a>
                <a href="emergency.html">Emergency</a>
                <a href="#resources">Resources</a>
                <a href="focus.html">Focus</a>
              </nav>
            </div>
          </div>
          
          <img src="logo.png" alt="MindEase" style="height: 50px;">
        </div>

        <!-- Right side: Main navigation -->
        <div class="nav-links">
          <a href="main.html">Home</a>
          <a href="../root/about.html">About Us</a>
          <a href="contact.html">Contact</a>
          <a href="feedback.html" class="active">Feedback</a>
        </div>
      </div>
    </header>

    <main>
      <!-- Feedback Header Section -->
      <div class="feedback-header">
        <h1>Help us with your feedback!</h1>
        <p>Your feedback helps us make MindEase better for you. Share your thoughts and suggestions—we're listening.</p>
      </div>

      <div class="feedback-container">
        <h2>Feedback Form</h2>
        <form id="feedbackForm">
          <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
          />
          <textarea 
            id="message" 
            placeholder="Your Message" 
            required
          ></textarea>
          <button type="submit">Submit</button>
        </form>
      </div>
    </main>

    <script>
      // Hamburger menu functionality
      document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("dropdown-toggle");
        const dropdownMenu = document.getElementById("dropdown-menu");

        toggleBtn.addEventListener("click", function () {
          dropdownMenu.classList.toggle("show");
        });

        // Close if clicking outside
        document.addEventListener("click", function (e) {
          if (
            !toggleBtn.contains(e.target) &&
            !dropdownMenu.contains(e.target)
          ) {
            dropdownMenu.classList.remove("show");
          }
        });
      });
    </script>

    <script type="module">
      import { db } from "./firebase.js";
      import {
        collection,
        addDoc,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

      const form = document.getElementById("feedbackForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const message = document.getElementById("message").value.trim();

        try {
          await addDoc(collection(db, "feedback"), {
            name,
            message,
            timestamp: new Date(),
          });
          alert("✅ Feedback submitted successfully!");
          form.reset();
        } catch (err) {
          console.error("Error submitting feedback:", err);
          alert("❌ Failed to submit feedback: " + err.message);
        }
      });
    </script>
  </body>
</html>
